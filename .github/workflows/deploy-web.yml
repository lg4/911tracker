# Deploys web/ to the Static Web App. Auth is via the SWA api key secret
# (AZURE_SWA_API_TOKEN, from `terraform output static_site_api_key`); no Azure
# login needed for this job.
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Point the map at the deployed incidents function before uploading.
      - name: Bake API URL
        run: sed -i "s|REPLACE-WITH-FUNCTION-APP|${{ vars.FUNCTION_APP_NAME }}|" web/config.js

      # The azure/static-web-apps-deploy action's container has a known bug where
      # api-token "Publish" deployments fail server-side ("deployment_action was not
      # provided"); the SWA CLI is the supported CI path instead. AZURE_SWA_API_TOKEN
      # is properties.apiKey of the site (= deployment token).
      - name: Deploy to Static Web App
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_SWA_API_TOKEN }}
        run: npx --yes @azure/static-web-apps-cli@latest deploy web --env production

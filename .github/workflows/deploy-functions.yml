# Deploys functions/ (plus its src/ dependencies) to the Azure Function App.
# Auth: service principal oneida911-gh-deploy (Contributor on RG oneida911), via
# AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID vars + AZURE_CLIENT_SECRET
# secret. A user-assigned MI (gh-oneida911-deploy) with federated credentials for
# this repo already exists in the RG; flip back to pure OIDC once its app
# registration syncs into Microsoft Graph (see docs/runbook.md).
name: deploy-functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/config.js'
      - 'src/ingest/fetchSource.js'
      - 'src/ingest/parse.js'
      - 'src/store/tableStore.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The function code imports shared modules from src/, which live outside
      # functions/. Stage a self-contained bundle mirroring the repo layout so the
      # relative '../../src/...' imports resolve after deployment.
      - name: Stage deployment bundle
        run: |
          mkdir -p dist/src/ingest dist/src/store
          cp -r functions/* dist/
          rm -f dist/local.settings.example.json
          cp package.json package-lock.json dist/
          cp src/config.js dist/src/
          cp src/ingest/fetchSource.js src/ingest/parse.js dist/src/ingest/
          cp src/store/tableStore.js dist/src/store/

      - name: Install dependencies
        working-directory: dist
        run: npm ci

      - name: Log in to Azure
        # Plain az CLI login: the azure/login action kept forcing the OIDC/federated path
        # regardless of auth-type; explicit service-principal login removes that ambiguity.
        # Secret goes through an env var — inline ${{ secrets.* }} expansion breaks if the
        # password contains shell-special characters.
        env:
          AZURE_SP_PASSWORD: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          az login --service-principal \
            -u "${{ vars.AZURE_CLIENT_ID }}" \
            -p "$AZURE_SP_PASSWORD" \
            --tenant "${{ vars.AZURE_TENANT_ID }}"
          az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: 'dist'

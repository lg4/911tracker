# Deploys functions/ (plus its src/ dependencies) to the Azure Function App via
# OIDC workload identity federation — no secrets in this repo. The managed identity
# gh-oneida911-deploy (RG oneida911) holds Contributor on the resource group; see
# docs/runbook.md for setup details.
name: deploy-functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/config.js'
      - 'src/ingest/fetchSource.js'
      - 'src/ingest/parse.js'
      - 'src/store/tableStore.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The function code imports shared modules from src/, which live outside
      # functions/. Stage a self-contained bundle mirroring the repo layout so the
      # relative '../../src/...' imports resolve after deployment.
      - name: Stage deployment bundle
        run: |
          mkdir -p dist/src/ingest dist/src/store
          cp -r functions/* dist/
          rm -f dist/local.settings.example.json
          cp package.json package-lock.json dist/
          cp src/config.js dist/src/
          cp src/ingest/fetchSource.js src/ingest/parse.js dist/src/ingest/
          cp src/store/tableStore.js dist/src/store/

      - name: Install dependencies
        working-directory: dist
        run: npm ci

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: 'dist'

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oneida County 911 Activity Map</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <style>
    html, body { height: 100%; }
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; }
    /* Map fills whatever is left after the (wrapping) header, so mobile
       wraps never clip or overlap the map. */
    #map { flex: 1; min-height: 0; width: 100%; }
    /* Panning beyond the local tile pyramid shows this "no coverage" fill
       instead of a broken white void. */
    .leaflet-container { background: #d7e3ee; }
    :root { --bg: #1c2330; --panel: #232b3a; --text: #e8ecf3; --muted: #aab4c5; --border: #3a4555; --accent: #2563eb; }
    body.light { --bg: #f2f5fa; --panel: #ffffff; --text: #1c2330; --muted: #5b6b82; --border: #cdd6e4; }
    header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: var(--bg); color: var(--text); flex-wrap: wrap; }
    header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
    header label { font-size: 13px; color: var(--muted); }
    input[type=date] { padding: 4px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    button { padding: 5px 12px; border-radius: 4px; border: none; background: var(--accent); color: white; cursor: pointer; font-size: 13px; }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    button.ghost.active { color: var(--text); border-color: var(--accent); }
    #status { font-size: 13px; color: var(--muted); min-width: 90px; }
    .credit { font-size: 12px; color: var(--muted); }
    /* Category filter chips (T8): All + Police/Fire/EMS/Other pills with counts. */
    #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px dashed var(--border); background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: line-through; }
    .chip.on { border-style: solid; background: var(--panel); color: var(--text); text-decoration: none; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
    body.dark .leaflet-tile {
      /* Darken the local OSM tiles with a pure-CSS transform so the map matches
         the dark app chrome without any second tile set or external service. */
      filter: invert(1) hue-rotate(200deg) brightness(.9) contrast(.9);
    }
  </style>
</head>
<body>
  <header>
    <h1>Oneida County, NY — 911 activity heatmap</h1>
    <label>From <input type="date" id="since" /></label>
    <label>To <input type="date" id="until" /></label>
    <span style="display:flex;gap:6px">
      <button class="ghost" data-days="1">Today</button>
      <button class="ghost" data-days="7">7 days</button>
      <button class="ghost active" data-days="30">30 days</button>
    </span>
    <button id="update">Update map</button>
    <button id="theme" class="ghost" title="Toggle light/dark basemap" aria-label="Toggle light or dark basemap">Dark</button>
    <span id="status" role="status" aria-live="polite"></span>
    <span class="credit">Data: oneidacountyny.gov + ongov.net public feeds · open source</span>
  </header>
  <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--border)">
    <span style="font-size:12px;color:var(--muted)">County:</span>
    <button class="chip on" data-county="oneida" aria-pressed="true">Oneida</button>
    <!-- T15: Onondaga off by default — CADInet rows carry no street/area context, so
         its points don't mean anything relative to an area; ingest keeps storing it. -->
    <button class="chip" data-county="onondaga" aria-pressed="false">Onondaga</button>
  </div>
  <div id="chips" role="group" aria-label="Filter incident categories"></div>
  <div id="map"></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet-heat.js"></script>
  <script src="./config.js"></script>
  <script>
    // Central-NY focus box; the app is fully self-contained (local vendored
    // Leaflet + locally stored basemap tiles) so no external tile/CDN calls.
    const BOUNDS = [[42.8, -76.6], [43.6, -75.0]];

    // Partial viscosity resists panning past the covered box mid-drag and lets
    // a drag briefly peek in from the edge; on release the view settles back in-bounds.
    const map = L.map('map', {
      maxBounds: BOUNDS,
      maxBoundsViscosity: 0.5,
      worldCopyJump: false,
      minZoom: 7,
      maxZoom: 14,
    });
    // Start centered on Utica (the original Oneida focus); update() re-fits once
    // incidents arrive. maxBounds above still lets panning reach Syracuse if the
    // user toggles Onondaga back on.
    map.setView([43.1, -75.23], 9);

    // Keep Leaflet's internal size in sync when the flex layout changes
    // (window resize, mobile orientation change, header re-wrapping).
    function resyncSize() { map.invalidateSize(); }
    window.addEventListener('resize', resyncSize);
    window.addEventListener('orientationchange', resyncSize);
    if ('ResizeObserver' in window) new ResizeObserver(resyncSize).observe(document.getElementById('map'));

    L.tileLayer('/tiles/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
      minZoom: 7,
      maxNativeZoom: 14, // pyramid now covers z7-z14 (T9)
      maxZoom: 14,
      bounds: BOUNDS,
      noWrap: true,
    }).addTo(map);

    // Incident categories (T8): raw feed types are far too varied and numerous to show
    // as chips individually, so classify each incident into one of these for filtering
    // and heat coloring. Keyword rules over type+title; unmatched → other.
    const CATS = [
      { key: 'police', label: 'Police', color: '#4361ee' },
      { key: 'fire', label: 'Fire', color: '#e63946' },
      { key: 'ems', label: 'EMS', color: '#2a9d8f' },
      { key: 'other', label: 'Other', color: '#9aa0b4' },
    ];
    // T14: numeric CAD dispatch codes (06D02-BREATHING PROBLEMS, 31D04-UNCONSCIOUS/FAINTING,
    // 33C07-TRANSFER, …) all follow the XX[BCD]YY pattern and are EMS responses.
    const EMS_CODE_RX = /^\d{2}[BCD]\d{2}\b/i;
    const CATEGORY_RX = {
      fire: /\b(FIRE|BURN(?:ING)?|SMOKE|CARBON MONOXIDE|HAZMAT|CHEMICAL|ALARM)\b|MVA-FD/i,
      // No bare ASSIST here: it is tested before police and would sink police-support
      // types ("POLICE ASSIST", "OFFICER ASSIST") into EMS. A standalone "ASSIST" row
      // falls through to Other — safer than mis-bucketing a support call as EMS.
      ems: /\b(EMS|MEDICAL|AMBULANCE|TRANSFER|SICK|INJUR\w*|HEART\b|STROKE|LACERATION|HEMORRHAGE|CHEST PAIN|FALL(?:EN)?|OVERDOSE|UNRESPONSIVE|UNCONSCIOUS|FAINTING|RESPIRAT\w*|BREATH(?:ING)?|CARDIAC|SEIZURE|CONVULSI\w*|DIABETIC|BP READ)\b|MVA-MED/i,
      police: /\b(POLICE|OFFICER|DOMESTIC|TRESPASS\S*|SUSPICIOUS|MISSING PERSON|CRIMINAL|CRIM\b|WELFARE|THEFT|ROBBERY|ASSAULT|FIGHT\b|DISORDERLY|SHOOTING|REPORT\w*|DRUG\S*|DISPUTE|LARCENY|HARASSMENT|FRAUD|BURGLARY|LOCKOUT|NOISE COMPLAINT|SHOTS FIRED|VEHICLE STOLEN|ORDER OF PROTECTION|PROPERTY (?:FOUND|LOST)|TRAFFIC HAZARD|DISABLED VEHICLE|PREMISE CHECK|INVESTIGAT\w*|JUVENILE|NEIGHBOR PROBLEM|ANIMAL)\b|\bPD\b|MVA-PD/i,
    };
    function classify(f) {
      const type = (f.properties.type ?? '').toUpperCase();
      const text = `${type} ${f.properties.title ?? ''}`.toUpperCase();
      if (CATEGORY_RX.fire.test(text)) return 'fire';
      if (EMS_CODE_RX.test(type) || CATEGORY_RX.ems.test(text)) return 'ems';
      if (CATEGORY_RX.police.test(text)) return 'police';
      return 'other';
    }

    let heatLayers = []; // one L.heatLayer per visible category
    // Cap the layer max low so clusters saturate through the gradient while isolated
    // points stay near the minOpacity floor (leaflet-heat's default max of 1 would
    // push a single incident straight to full color).
    const HEAT_MAX = 6;
    // Full-alpha stops over a valid hex base — never emit 3-digit-hex + appended alpha.
    function gradientFor(color) {
      return { 0.3: color + '33', 0.6: color + '99', 1: color };
    }

    let allFeatures = [];
    const hiddenCats = new Set();
    // T11 toggles above the type chips; initial on/off comes from the static markup
    // (T15 ships Onondaga off by default) rather than assuming everything visible.
    const hiddenCounties = new Set([...document.querySelectorAll('[data-county]')].filter((b) => !b.classList.contains('on')).map((b) => b.dataset.county));

    // Counties present in the fetched window drive which toggle buttons are shown/enabled.
    function visibleFeatures() {
      return allFeatures.filter((f) => !hiddenCounties.has(f.properties.county));
    }

    function buildCountyToggles() {
      document.querySelectorAll('[data-county]').forEach((btn) => {
        btn.classList.toggle('on', !hiddenCounties.has(btn.dataset.county));
        btn.setAttribute('aria-pressed', String(!hiddenCounties.has(btn.dataset.county)));
      });
    }

    function renderHeat() {
      for (const l of heatLayers) map.removeLayer(l);
      heatLayers = [];
      const byCat = new Map();
      for (const f of visibleFeatures()) {
        const c = classify(f);
        if (hiddenCats.has(c)) continue;
        if (!byCat.has(c)) byCat.set(c, []);
        byCat.get(c).push([f.geometry.coordinates[1], f.geometry.coordinates[0]]);
      }
      for (const [c, pts] of byCat) {
        // Per-category layers keep colors distinct when filtering is active; with every
        // category visible they simply stack in their own hue.
        heatLayers.push(L.heatLayer(pts, { radius: 22, blur: 18, maxZoom: 9, max: HEAT_MAX, gradient: gradientFor(CATS.find((x) => x.key === c).color) }).addTo(map));
      }
      const shown = [...byCat.values()].reduce((n, a) => n + a.length, 0);
      // Freshness (T12 trust signal): newest lastSeenAt across visible rows, human-readable.
      let latest = null;
      for (const f of visibleFeatures()) {
        if (hiddenCats.has(classify(f))) continue;
        const ts = Date.parse(f.properties.lastSeenAt);
        if (!Number.isNaN(ts) && (!latest || ts > latest.ts)) latest = { ts, at: new Date(ts).toLocaleString() };
      }
      let label = shown === 0
        ? 'No incidents in this window — try widening the dates'
        : `${shown} incident${shown === 1 ? '' : 's'}`;
      if (latest) label += ` · updated ${latest.at}`;
      document.getElementById('status').textContent = label;
    }

    function buildChips() {
      const box = document.getElementById('chips');
      box.textContent = '';
      // County toggles reflect what is present in the fetched window (legacy rows have no county).
      const presentCounties = new Set(allFeatures.map((f) => f.properties.county));
      // Absent counties are only *disabled*, never re-enabled: dropping them from
      // hiddenCounties here would silently undo the user's off choice (or T15's
      // default-off) the moment a refetch window lacks that county's rows. Leaving
      // an absent county hidden is inert — it has no rows to filter out anyway.
      document.querySelectorAll('[data-county]').forEach((btn) => {
        btn.disabled = !presentCounties.has(btn.dataset.county);
      });
      buildCountyToggles();
      const counts = new Map();
      hiddenCats.clear();
      // Counts are per-category over the currently-visible counties.
      for (const f of visibleFeatures()) counts.set(classify(f), (counts.get(classify(f)) ?? 0) + 1);
      const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]);
      if (!sorted.length) return;
      const shownNow = visibleFeatures().length;
      const reset = document.createElement('button');
      reset.className = 'chip on';
      reset.id = 'chip-all';
      reset.textContent = `All (${shownNow})`;
      reset.addEventListener('click', () => {
        hiddenCats.clear();
        syncChipStates();
        renderHeat();
      });
      box.appendChild(reset);
      for (const [c, n] of sorted) {
        const meta = CATS.find((x) => x.key === c);
        const chip = document.createElement('button');
        chip.className = 'chip on';
        chip.dataset.type = c;
        chip.title = `${n} incident${n === 1 ? '' : 's'}`;
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = meta.color;
        chip.append(dot, ` ${meta.label} (${n})`);
        chip.setAttribute('aria-pressed', 'true');
        chip.addEventListener('click', () => {
          hiddenCats.has(c) ? hiddenCats.delete(c) : hiddenCats.add(c);
          syncChipStates();
          renderHeat();
        });
        box.appendChild(chip);
      }
    }

    function syncChipStates() {
      document.getElementById('chips').querySelectorAll('.chip[data-type]').forEach((c) => {
        const visible = !hiddenCats.has(c.dataset.type);
        c.classList.toggle('on', visible);
        c.setAttribute('aria-pressed', String(visible));
      });
      const all = document.getElementById('chip-all');
      if (all) { all.classList.toggle('on', hiddenCats.size === 0); all.setAttribute('aria-pressed', String(hiddenCats.size === 0)); }
    }

    async function update() {
      const statusEl = document.getElementById('status');
      const since = document.getElementById('since').value || undefined;
      const until = document.getElementById('until').value || undefined;
      const params = new URLSearchParams();
      if (since) params.set('since', since);
      if (until) params.set('until', until);
      statusEl.textContent = 'Loading…';
      try {
        const res = await fetch(`${API_URL}?${params.toString()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const geo = await res.json();
        // Pre-T11 Oneida rows carry no county property; treat them as oneida so the
        // toggle row stays consistent with what the API returns untagged.
        allFeatures = geo.features.map((f) => ({
          ...f,
          properties: { ...f.properties, county: f.properties.county ?? 'oneida' },
        }));
        buildChips();
        renderHeat();
        // Frame the view on visible counties only — a default-hidden county (T15) must
        // not drag the initial viewport across the box toward it.
        const pts = visibleFeatures().map((f) => [f.geometry.coordinates[1], f.geometry.coordinates[0]]);
        if (pts.length) {
          map.fitBounds(L.latLngBounds([Math.min(...pts.map((p) => p[0])), Math.min(...pts.map((p) => p[1]))], [Math.max(...pts.map((p) => p[0])), Math.max(...pts.map((p) => p[1]))]).pad(0.15));
        }
      } catch (err) {
        // Plain-language failure with a recovery path: the Update button retries.
        statusEl.textContent = `Couldn't load incidents (${err.message}) — hit "Update map" to retry`;
      }
    }

    function daysAgo(n) {
      const d = new Date(Date.now() - n * 24 * 60 * 60 * 1000);
      return d.toISOString().slice(0, 10);
    }
    document.getElementById('since').value = daysAgo(30);
    document.getElementById('until').value = daysAgo(0);

    // Quick time-window buttons: set the date inputs, then refresh in one click.
    document.querySelectorAll('button[data-days]').forEach((btn) => {
      btn.addEventListener('click', () => {
        // data-days is the window in days inclusive of today: Today → 0 days back.
        document.getElementById('since').value = daysAgo(Math.max(Number(btn.dataset.days) - 1, 0));
        document.getElementById('until').value = daysAgo(0);
        document.querySelectorAll('button[data-days]').forEach((b) => b.classList.toggle('active', b === btn));
        update();
      });
    });

    // Light/dark toggle (T10): dark is the default look; light flips CSS variables and
    // keeps the tile layer as-is (no second pyramid needed). Persisted per browser.
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      document.body.classList.toggle('light', !dark);
      const b = document.getElementById('theme');
      b.textContent = dark ? 'Dark' : 'Light';
      try { localStorage.setItem('theme-dark', dark ? '1' : ''); } catch {}
    }
    // Dark is the default look; only an explicit stored 'light' choice overrides it.
    let savedDark = true;
    try { if (localStorage.getItem('theme-dark') === '') savedDark = false; } catch {}
    applyTheme(savedDark);
    document.getElementById('theme').addEventListener('click', () => {
      savedDark = !document.body.classList.contains('dark');
      applyTheme(savedDark);
    });

    // T11 county toggles: hide/show an entire county's incidents without re-fetching;
    // type chips above already respect the same hiddenCounties set via visibleFeatures().
    document.querySelectorAll('[data-county]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const c = btn.dataset.county;
        if (hiddenCounties.has(c)) hiddenCounties.delete(c); else hiddenCounties.add(c);
        buildCountyToggles();
        renderHeat();
      });
    });

    document.getElementById('update').addEventListener('click', update);
    update();
  </script>
</body>
</html>

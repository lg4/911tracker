<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oneida County 911 Activity Map</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <style>
    html, body { height: 100%; }
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; }
    /* Map fills whatever is left after the (wrapping) header, so mobile
       wraps never clip or overlap the map. */
    #map { flex: 1; min-height: 0; width: 100%; }
    /* Panning beyond the local tile pyramid shows this "no coverage" fill
       instead of a broken white void. */
    .leaflet-container { background: #d7e3ee; }
    header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #1c2330; color: #e8ecf3; flex-wrap: wrap; }
    header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
    header label { font-size: 13px; color: #aab4c5; }
    input[type=date] { padding: 4px 6px; border-radius: 4px; border: 1px solid #3a4555; background: #232b3a; color: #e8ecf3; }
    button { padding: 5px 12px; border-radius: 4px; border: none; background: #3d7eff; color: white; cursor: pointer; font-size: 13px; }
    #status { font-size: 13px; color: #aab4c5; min-width: 90px; }
    .credit { font-size: 11px; color: #7d8aa0; }
  </style>
</head>
<body>
  <header>
    <h1>Oneida County, NY — 911 activity heatmap</h1>
    <label>From <input type="date" id="since" /></label>
    <label>To <input type="date" id="until" /></label>
    <button id="update">Update map</button>
    <span id="status"></span>
    <span class="credit">Data: oneidacountyny.gov public feed · open source</span>
  </header>
  <div id="map"></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet-heat.js"></script>
  <script src="./config.js"></script>
  <script>
    // Central-NY focus box; the app is fully self-contained (local vendored
    // Leaflet + locally stored basemap tiles) so no external tile/CDN calls.
    const BOUNDS = [[42.8, -76.6], [43.6, -75.0]];

    // Partial viscosity resists panning past the covered box mid-drag and lets
    // a drag briefly peek in from the edge; on release the view settles back in-bounds.
    const map = L.map('map', {
      maxBounds: BOUNDS,
      maxBoundsViscosity: 0.5,
      worldCopyJump: false,
      minZoom: 7,
      maxZoom: 14,
    });
    // Start framed exactly on the covered box so the first paint shows only
    // real basemap (no edge voids); update() re-fits once incidents arrive.
    map.fitBounds(BOUNDS);

    // Keep Leaflet's internal size in sync when the flex layout changes
    // (window resize, mobile orientation change, header re-wrapping).
    function resyncSize() { map.invalidateSize(); }
    window.addEventListener('resize', resyncSize);
    window.addEventListener('orientationchange', resyncSize);
    if ('ResizeObserver' in window) new ResizeObserver(resyncSize).observe(document.getElementById('map'));

    L.tileLayer('/tiles/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
      minZoom: 7,
      maxNativeZoom: 12,
      maxZoom: 14,
      bounds: BOUNDS,
      noWrap: true,
    }).addTo(map);

    let heatLayer = null;

    function daysAgo(n) {
      const d = new Date(Date.now() - n * 24 * 60 * 60 * 1000);
      return d.toISOString().slice(0, 10);
    }
    document.getElementById('since').value = daysAgo(30);
    document.getElementById('until').value = daysAgo(0);

    async function update() {
      const statusEl = document.getElementById('status');
      const since = document.getElementById('since').value || undefined;
      const until = document.getElementById('until').value || undefined;
      const params = new URLSearchParams();
      if (since) params.set('since', since);
      if (until) params.set('until', until);
      statusEl.textContent = 'loading…';
      try {
        const res = await fetch(`${API_URL}?${params.toString()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const geo = await res.json();
        const points = geo.features.map((f) => [f.geometry.coordinates[1], f.geometry.coordinates[0]]);
        if (heatLayer) map.removeLayer(heatLayer);
        heatLayer = L.heatLayer(points, { radius: 22, blur: 18, maxZoom: 14 }).addTo(map);
        statusEl.textContent = `${geo.features.length} incidents`;
        if (points.length) {
          const lats = points.map((p) => p[0]);
          const lngs = points.map((p) => p[1]);
          map.fitBounds(L.latLngBounds([Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]).pad(0.15));
        }
      } catch (err) {
        statusEl.textContent = `error: ${err.message}`;
      }
    }

    document.getElementById('update').addEventListener('click', update);
    update();
  </script>
</body>
</html>
